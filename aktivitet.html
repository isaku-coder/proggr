<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="aktivitet.css">
</head>
<body>
<section id="activities">

    <h2>Aktivitetet e Gjimnazit</h2>

    <div class="upload-box">

        <input type="file" id="imageUpload" accept="image/*">

        <textarea
            id="activityText"
            placeholder="Shkruaj përshkrimin e aktivitetit...">
        </textarea>

        <button id="addActivity">
            Shto Aktivitetin
        </button>

    </div>

    <div id="activitiesContainer"></div>

</section>

<script src="aktivitet.js"></script>

    
</body>
</html>
